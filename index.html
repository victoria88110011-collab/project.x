<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agent Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
font-family:Arial, sans-serif;
background:#fff;
}

.wrap{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

.topbar{
padding:14px 20px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
}

.title{
font-size:22px;
font-weight:800;
}

.status{
font-size:16px;
opacity:.7;
}

.chart{
flex:1;
padding:20px;
box-sizing:border-box;
}

.plot{
position:relative;
width:100%;
height:100%;
border:1px solid #eee;
border-radius:14px;
overflow:hidden;
background:
linear-gradient(to bottom, rgba(0,0,0,.07) 1px, transparent 1px);
background-size:100% 20%;
}

canvas{
width:100%;
height:100%;
display:block;
}

</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
<div class="title">Agent statistics</div>
<div class="status" id="status">Загрузка…</div>
</div>

<div class="chart">
<div class="plot">
<canvas id="chart"></canvas>
</div>
</div>

</div>

<script>

const SPREADSHEET_ID = "1d801Kn2bLsQeg4ftU3oeWQXgvA6B5GsGkjzEwjeh1b8"
const GID = "119792443"
const RANGE = "C3:D19"

const REFRESH_MS = 90000

const statusEl = document.getElementById("status")
const canvas = document.getElementById("chart")

function csvUrl(){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}&t=${Date.now()}`
}

function parseCSV(text){

if(text.charCodeAt(0)===0xFEFF) text=text.slice(1)

const rows=[]
let row=[]
let cell=""
let inQuotes=false

for(let i=0;i<text.length;i++){

const ch=text[i]
const next=text[i+1]

if(ch=='"' && inQuotes && next=='"'){cell+='"';i++;continue}
if(ch=='"'){inQuotes=!inQuotes;continue}

if(ch=="\n" && !inQuotes){
row.push(cell)
rows.push(row)
row=[]
cell=""
continue
}

if(ch=="\r")continue

if(ch=="," && !inQuotes){
row.push(cell)
cell=""
continue
}

cell+=ch
}

row.push(cell)
rows.push(row)

return rows
}

function toNumber(v){
const s=String(v).replace(/\s/g,"").replace(",",".")
const n=Number(s)
return Number.isFinite(n)?n:0
}

function niceMax(v){

if(v<=0)return 1

const exp=Math.pow(10,Math.floor(Math.log10(v)))
const frac=v/exp

let niceFrac

if(frac<=1)niceFrac=1
else if(frac<=2)niceFrac=2
else if(frac<=5)niceFrac=5
else niceFrac=10

return niceFrac*exp
}

function draw(){

const rect=canvas.parentElement.getBoundingClientRect()

const dpr=window.devicePixelRatio||1

canvas.width=rect.width*dpr
canvas.height=rect.height*dpr

canvas.style.width=rect.width+"px"
canvas.style.height=rect.height+"px"

const ctx=canvas.getContext("2d")
ctx.setTransform(dpr,0,0,dpr,0,0)

return ctx
}

function renderChart(data){

const ctx=draw()

const rect=canvas.getBoundingClientRect()

const pad=60

const W=rect.width-pad*2
const H=rect.height-pad*2

const max=Math.max(...data.map(d=>d.value))
const axisMax=niceMax(max)

const gap=18
const barW=Math.max(20,(W-gap*(data.length-1))/data.length)

let x=pad

data.forEach(it=>{

const pct=it.value/axisMax
const h=pct*H

const y=pad+H-h

ctx.fillStyle="#1f2937"
ctx.fillRect(x,y,barW,h)

ctx.fillStyle="#000"
ctx.font="bold 20px Arial"
ctx.textAlign="center"

ctx.fillText(it.value,x+barW/2,y-6)

ctx.save()
ctx.translate(x+barW/2,pad+H+10)
ctx.rotate(-Math.PI/3)
ctx.fillText(it.name,0,0)
ctx.restore()

x+=barW+gap

})

}

async function load(){

try{

statusEl.textContent="Загрузка..."

const text=await fetch(csvUrl(),{cache:"no-store"}).then(r=>r.text())

const rows=parseCSV(text)

const data=rows.map(r=>({
name:r[0],
value:toNumber(r[1])
}))

data.sort((a,b)=>b.value-a.value)

renderChart(data)

statusEl.textContent="Обновлено: "+new Date().toLocaleTimeString()

}catch(e){

statusEl.textContent="Ошибка"

}

}

load()
setInterval(load,REFRESH_MS)

window.addEventListener("resize",load)

</script>

</body>
</html>
