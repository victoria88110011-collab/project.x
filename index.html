<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#0b0f1a;
font-family:Arial,sans-serif;
color:#fff;
}

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows:80px 2fr 1fr;
gap:10px;
padding:20px;
box-sizing:border-box;
}

/* TOTAL */

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
font-weight:900;
color:#fff;
background:linear-gradient(180deg,#1f2937,#020617);
border-radius:16px;
box-shadow:
0 10px 40px rgba(0,0,0,.6),
inset 0 0 20px rgba(255,255,255,.05);
letter-spacing:3px;
}

/* chart */

.plot{
position:relative;
border-radius:18px;
overflow:hidden;
background:linear-gradient(180deg,#0f172a,#020617);
box-shadow:inset 0 0 60px rgba(0,0,0,.7);
}

canvas{
width:100%;
height:100%;
display:block;
}

/* target */

.targetLabel{
position:absolute;
right:10px;
font-size:14px;
font-weight:900;
color:#fff;
background:#ef4444;
padding:4px 10px;
border-radius:999px;
}

.targetLine{
position:absolute;
left:0;
right:0;
height:2px;
background:#ef4444;
box-shadow:0 0 10px #ef4444;
}

/* names */

.xlabels{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
padding-top:10px;
}

.xlabel{
flex:1;
text-align:center;
font-weight:900;
font-size:60px;
transform:rotate(-60deg);
color:#cbd5f5;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const TARGET=150000;
const REFRESH_MS=90000;
const RANGE="J3:K19";

const chart=document.getElementById("chart");

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

/* CSV parser */

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;
}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);

}

function toNumber(v){
const s=String(v??"").replace(/\s/g,"").replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

/* colors */

const COLORS=[
["#ff2ea6","#ff6ad5"],
["#7c4dff","#c084fc"],
["#06b6d4","#67e8f9"],
["#22c55e","#4ade80"]
];

function colorForIndex(i){
return COLORS[i%COLORS.length];
}

/* 3D neon bar */

function draw3DBar(ctx,x,y,w,h,c1,c2){

const depth=10;

/* front */

const g=ctx.createLinearGradient(0,y,0,y+h);
g.addColorStop(0,c2);
g.addColorStop(1,c1);

ctx.shadowBlur=25;
ctx.shadowColor=c1;

ctx.fillStyle=g;
ctx.fillRect(x,y,w,h);

ctx.shadowBlur=0;

/* side */

ctx.beginPath();
ctx.moveTo(x+w,y);
ctx.lineTo(x+w+depth,y-depth);
ctx.lineTo(x+w+depth,y+h-depth);
ctx.lineTo(x+w,y+h);
ctx.closePath();

ctx.fillStyle=c1;
ctx.globalAlpha=.5;
ctx.fill();
ctx.globalAlpha=1;

/* top */

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+depth,y-depth);
ctx.lineTo(x+w+depth,y-depth);
ctx.lineTo(x+w,y);
ctx.closePath();

ctx.fillStyle=c2;
ctx.globalAlpha=.7;
ctx.fill();
ctx.globalAlpha=1;

/* highlight */

const highlight=ctx.createLinearGradient(x,y,x+w,y);
highlight.addColorStop(0,"rgba(255,255,255,.5)");
highlight.addColorStop(.4,"rgba(255,255,255,.15)");
highlight.addColorStop(1,"rgba(255,255,255,0)");

ctx.fillStyle=highlight;
ctx.fillRect(x,y,w,h);

}

/* scaling */

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;

}

/* render */

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));
items.sort((a,b)=>b.value-a.value);

const total=items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

const targetPct=(TARGET/axisMax)*100;

chart.innerHTML=`
<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">

<div class="targetLine" style="bottom:${targetPct}%"></div>
<div class="targetLabel" style="bottom:${targetPct}%">TARGET</div>

<canvas></canvas>

</div>

<div class="xlabels">
${items.map(it=>`<div class="xlabel">${it.name}</div>`).join("")}
</div>

</div>
`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const pad=20;

const W=rect.width-pad*2;
const H=rect.height-pad*2;

const n=items.length;
const gap=20;
const barW=Math.max(18,(W-gap*(n-1))/n);

let startX=pad;

items.forEach((it,i)=>{

const pct=(it.value/axisMax)*100;
const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=rect.height-pad-h;

const [c1,c2]=colorForIndex(i);

draw3DBar(ctx,x,y,barW,h,c1,c2);

/* value */

ctx.fillStyle="#ffffff";
ctx.font="bold 48px Arial";
ctx.textAlign="center";

ctx.fillText(it.value.toLocaleString(), x+barW/2, y-10);

});

}

redraw();
window.addEventListener("resize",redraw);

}

/* load */

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());
const data=parseCSV(text);

renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
