<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart PRO</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(180deg,#0f172a,#020617);
font-family:Inter,Arial,sans-serif;
color:#fff;
}

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows: 90px 1fr 140px;
gap:14px;
padding:20px;
box-sizing:border-box;
}

/* TOTAL */

.cap{
display:flex;
justify-content:center;
align-items:center;

font-size:64px;
font-weight:900;

background:linear-gradient(90deg,#22c55e,#4ade80);
color:#022c22;

border-radius:16px;

box-shadow:
0 10px 30px rgba(0,0,0,.45),
0 0 20px rgba(34,197,94,.35),
0 0 60px rgba(34,197,94,.2);
}

/* plot */

.plot{
position:relative;
border-radius:18px;

background:
radial-gradient(circle at top,rgba(255,255,255,.08),transparent 70%),
linear-gradient(180deg,#020617,#020617);

box-shadow:
inset 0 0 40px rgba(255,255,255,.05),
0 10px 40px rgba(0,0,0,.6);
}

canvas{
width:100%;
height:100%;
display:block;
}

/* target */

.targetLabel{
position:absolute;
right:10px;
font-size:14px;
font-weight:900;
color:#fff;
background:#e11d48;
padding:4px 8px;
border-radius:999px;
}

.targetLine{
position:absolute;

right:0;

opacity:.8;
}

.xlabels{

align-items:flex-start;

padding-top:30px;
}

.xlabel{
flex:1;
text-align:center;

font-weight:900;
font-size:52px; /* +30% */

transform:rotate(-60deg);
transform-origin:center;

color:#e2e8f0;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const TARGET=150000;
const REFRESH_MS=90000;

const RANGE="J3:K19";

const chart=document.getElementById("chart");

/* neon colors */

const COLORS=[
["#ff0080","#ff5db1"],
["#7c3aed","#a78bfa"],
["#06b6d4","#22d3ee"],
["#22c55e","#4ade80"],
["#f97316","#fb923c"]
];

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){
const rows=[];
text.split("\n").forEach(line=>{
const r=line.split(",");
if(r.length>=2) rows.push([r[0].trim(),r[1].trim()]);
});
return rows;
}

function toNumber(v){
return Number(String(v).replace(/\s/g,"").replace(",","."))||0;
}

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;
}

/* glass bar */

function drawBar(ctx,x,y,w,h,colors){

const g=ctx.createLinearGradient(0,y,0,y+h);

g.addColorStop(0,colors[1]);
g.addColorStop(1,colors[0]);

ctx.fillStyle=g;

ctx.shadowColor=colors[1];
ctx.shadowBlur=30;

const r=10;

ctx.beginPath();

ctx.moveTo(x,y+r);
ctx.arcTo(x,y,x+r,y,r);
ctx.lineTo(x+w-r,y);
ctx.arcTo(x+w,y,x+w,y+r,r);
ctx.lineTo(x+w,y+h);
ctx.lineTo(x,y+h);

ctx.closePath();
ctx.fill();

/* glass highlight */

ctx.fillStyle="rgba(255,255,255,.18)";
ctx.fillRect(x+4,y+4,w-8,6);

ctx.shadowBlur=0;

}

function animateBars(ctx,bars,progress){

bars.forEach(bar=>{

const h=bar.h*progress;
const y=bar.baseY + (bar.h-h);

drawBar(ctx,bar.x,y,bar.w,h,bar.colors);

});
}

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));

items.sort((a,b)=>b.value-a.value);

const total = items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

const targetPct=(TARGET/axisMax)*100;

chart.innerHTML=`

<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">

<div class="targetLine" style="bottom:${targetPct}%"></div>
<div class="targetLabel" style="bottom:${targetPct}%">ЦЕЛЬ ${TARGET}</div>

<canvas></canvas>

</div>

<div class="xlabels">
${items.map(it=>`<div class="xlabel">${it.name}</div>`).join("")}
</div>

</div>
`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const pad=40;

const W=rect.width-pad*2;
const H=rect.height-pad*2;

const n=items.length;

const gap=24;
const barW=Math.max(20,(W-gap*(n-1))/n);

let startX=pad;

const bars=[];

items.forEach((it,i)=>{

const pct=(it.value/axisMax)*100;

const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=pad+(H-h);

bars.push({
x:x,
baseY:y,
h:h,
w:barW,
colors:COLORS[i%COLORS.length]
});

});

let progress=0;

function frame(){

progress+=0.05;
if(progress>1)progress=1;

ctx.clearRect(0,0,rect.width,rect.height);

animateBars(ctx,bars,progress);

/* labels */

bars.forEach((bar,i)=>{

const it=items[i];

const percent=Math.round((it.value/maxData)*100);

ctx.fillStyle="#fff";
ctx.textAlign="center";
ctx.font="900 40px Arial";

ctx.fillText(percent+"%",bar.x+bar.w/2,bar.baseY-12);

if(i===0){
ctx.font="50px serif";
ctx.fillText("👑",bar.x+bar.w/2,bar.baseY-50);
}

});

if(progress<1) requestAnimationFrame(frame);

}

frame();

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());
const data=parseCSV(text);
renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
