<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#020617;
font-family:Arial,sans-serif;
color:#22d3ee;
}

/* ==== BACKGROUND HUD ==== */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(0,255,255,.08), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(0,255,255,.06), transparent 40%);
pointer-events:none;
}

/* ==== CHART HOST ==== */

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows:80px 2fr 1fr;
gap:12px;
padding:25px;
box-sizing:border-box;
}

/* ==== TOTAL ==== */

.cap{

display:flex;
justify-content:center;
align-items:center;

font-size:70px;
font-weight:900;
letter-spacing:3px;

color:#22d3ee;

background:
linear-gradient(180deg,#020617,#000);

border-radius:14px;

box-shadow:
0 0 20px rgba(0,255,255,.35),
inset 0 0 15px rgba(0,255,255,.15);

}

/* ==== PLOT ==== */

.plot{
position:relative;
border-radius:12px;
overflow:hidden;

border:1px solid rgba(0,255,255,.25);

background:
linear-gradient(to bottom, rgba(0,255,255,.08) 1px, transparent 1px);

background-size:100% 20%;

box-shadow:
inset 0 0 30px rgba(0,255,255,.15);
}

canvas{
width:100%;
height:100%;
display:block;
}

/* ==== TARGET ==== */

.targetLabel{
position:absolute;
right:10px;
font-size:14px;
font-weight:900;
color:#f43f5e;
background:#020617;
padding:4px 8px;
border-radius:20px;
border:1px solid #f43f5e;
}

.targetLine{
position:absolute;
left:0;
right:0;
height:2px;
background:#f43f5e;
box-shadow:0 0 10px #f43f5e;
}

/* ==== LABELS ==== */

.xlabels{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:10px;
}

.xlabel{
flex:1;
text-align:center;
white-space:nowrap;

font-weight:900;
font-size:60px;

color:#22d3ee;

text-shadow:0 0 8px #22d3ee;

transform: translate(-12px,10px) rotate(-60deg);
transform-origin:center;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const TARGET=150000;
const REFRESH_MS=90000;

const MAKE_SMALL_VALUES_VISIBLE=true;
const MIN_VISIBLE_PCT=1.2;

const RANGE="J3:K19";

const chart=document.getElementById("chart");

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;

}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);

}

function toNumber(v){
const s=String(v??"").replace(/\s/g,"").replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;

}

/* ==== NEON BAR ==== */

function drawNeonBar(ctx,x,y,w,h){

ctx.fillStyle="#06b6d4";

ctx.shadowColor="#06b6d4";
ctx.shadowBlur=18;

ctx.fillRect(x,y,w,h);

ctx.shadowBlur=0;

ctx.strokeStyle="#67e8f9";
ctx.lineWidth=1.5;

ctx.strokeRect(x,y,w,h);

}

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));

items.sort((a,b)=>b.value-a.value);

const total = items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

const targetPct=(TARGET/axisMax)*100;

chart.innerHTML=`

<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">

<div class="targetLine" style="bottom:${targetPct}%"></div>
<div class="targetLabel" style="bottom:${targetPct}%">ЦЕЛЬ ${TARGET}</div>

<canvas></canvas>

</div>

<div class="xlabels">
${items.map(it=>`<div class="xlabel">${it.name}</div>`).join("")}
</div>

</div>
`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const padL=14,padR=22,padT=14,padB=22;

const W=rect.width-padL-padR;
const H=rect.height-padT-padB;

const n=items.length;
const gap=10;

const barW=Math.max(12,Math.floor((W-gap*(n-1))/n));

const totalW=n*barW+(n-1)*gap;

let startX=padL+(W-totalW)/2;

items.forEach((it,i)=>{

let pct=(it.value/axisMax)*100;

if(MAKE_SMALL_VALUES_VISIBLE&&it.value>0){
pct=Math.max(pct,MIN_VISIBLE_PCT);
}

const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=padT+(H-h);

/* ==== VALUES ==== */

ctx.fillStyle="#22d3ee";
ctx.font="800 48px Arial";
ctx.textAlign="center";

ctx.shadowColor="#22d3ee";
ctx.shadowBlur=8;

ctx.fillText(it.value,x+barW/2,y-8);

ctx.shadowBlur=0;

/* ==== BAR ==== */

drawNeonBar(ctx,x,y,barW,h);

});

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());
const data=parseCSV(text);

renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
