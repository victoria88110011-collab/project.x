<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#fff;
font-family:Arial,sans-serif;
}

.chartHost{
width:100vw;
height:100vh;
}

/* ==== Chart wrapper ==== */

.vwrap{
height:100%;
display:grid;
grid-template-rows: 22px 2fr 1fr;
gap:8px;
padding:20px;
box-sizing:border-box;
}

.cap{
display:flex;
justify-content:space-between;
align-items:center;
font-size:15px;
opacity:.75;
padding:0 6px;
white-space:nowrap;
}

.plot{
position:relative;
border:1px solid #eee;
border-radius:12px;
overflow:hidden;
background:
linear-gradient(to bottom, rgba(0,0,0,.08) 1px, transparent 1px);
background-size:100% 20%;
}

canvas{
width:100%;
height:100%;
display:block;
}

.targetLabel{
position:absolute;
right:8px;
font-size:13px;
font-weight:900;
color:#e11d48;
background:rgba(255,255,255,.92);
padding:2px 6px;
border-radius:999px;
}

.targetLine{
position:absolute;
left:0;
right:0;
height:2px;
background:#e11d48;
opacity:.85;
}

/* ==== Labels ==== */

.xlabels{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:6px 10px 0 10px;
}

.xlabel{
width:0;
flex:1;
text-align:center;
white-space:nowrap;
font-weight:900;
font-size:55px;

transform: translate(-12px,10px) rotate(-60deg);
transform-origin:center;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const TARGET=150000;
const REFRESH_MS=90000;

const MAKE_SMALL_VALUES_VISIBLE=true;
const MIN_VISIBLE_PCT=1.2;

const RANGE="J3:K19";

const chart=document.getElementById("chart");

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){
const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;
}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);
}

function toNumber(v){
const s=String(v??"").replace(/\s/g,"").replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

function hashString(s){
let h=2166136261;
for(let i=0;i<s.length;i++){
h^=s.charCodeAt(i);
h=Math.imul(h,16777619);
}
return h>>>0;
}

const COLORS=[
"#1f2937",
"#334155",
"#0f766e",
"#1e40af",
"#6b21a8",
"#7c2d12",
"#065f46",
"#3f3f46"
];

function colorForName(name){
return COLORS[hashString(name)%COLORS.length];
}

function niceMax(v){
if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;
}

function draw3DBar(ctx,x,y,w,h,color){

const depth=Math.min(10,Math.max(4,w*0.18));
const top=Math.min(10,Math.max(4,w*0.18));

ctx.fillStyle=color;
ctx.fillRect(x,y,w,h);

ctx.fillStyle="rgba(255,255,255,0.28)";
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+top,y-top);
ctx.lineTo(x+w,y-top);
ctx.lineTo(x+w-top,y);
ctx.closePath();
ctx.fill();

ctx.fillStyle="rgba(0,0,0,0.18)";
ctx.beginPath();
ctx.moveTo(x+w,y);
ctx.lineTo(x+w,y+h);
ctx.lineTo(x+w+depth,y+h-top);
ctx.lineTo(x+w+depth,y-top);
ctx.closePath();
ctx.fill();

}

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));

items.sort((a,b)=>b.value-a.value);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

const targetPct=(TARGET/axisMax)*100;

chart.innerHTML=`
<div class="vwrap">

<div class="cap"></div>

<div class="plot">

<div class="targetLine" style="bottom:${targetPct}%"></div>
<div class="targetLabel" style="bottom:${targetPct}%">ЦЕЛЬ ${TARGET}</div>

<canvas></canvas>

</div>

<div class="xlabels">
${items.map(it=>`<div class="xlabel">${it.name}</div>`).join("")}
</div>

</div>
`;

const labelsEl = chart.querySelector(".xlabels");
const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const padL=14,padR=22,padT=14,padB=22;

const W=rect.width-padL-padR;
const H=rect.height-padT-padB;

const n=items.length;
const gap=8;
const barW=Math.max(10,Math.floor((W-gap*(n-1))/n));

const totalW=n*barW+(n-1)*gap;

let startX=padL+(W-totalW)/2;

items.forEach((it,i)=>{

let pct=(it.value/axisMax)*100;

if(MAKE_SMALL_VALUES_VISIBLE&&it.value>0){
pct=Math.max(pct,MIN_VISIBLE_PCT);
}

const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=padT+(H-h);

ctx.fillStyle="#000";
ctx.font="800 50px Arial";
ctx.textAlign="center";

ctx.fillText(it.value,x+barW/2,y-6);

draw3DBar(ctx,x,y,barW,h,colorForName(it.name));

});

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());

const data=parseCSV(text);

renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>
</body>
</html>
