<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#24134a;
font-family:Arial,sans-serif;
color:#fff;
}

.chartHost{
width:100vw;
height:100vh;
}

/* ==== Layout ==== */

.vwrap{
height:100%;
display:grid;
grid-template-rows: 80px 2fr 1fr;
gap:10px;
padding:25px;
box-sizing:border-box;
}

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
font-weight:900;
background:linear-gradient(90deg,#ff00aa,#ff4d00);
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.plot{
position:relative;
border-radius:12px;
overflow:hidden;
}

canvas{
width:100%;
height:100%;
display:block;
}

/* ==== Labels ==== */

.xlabels{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:6px 10px 0 10px;
}

.xlabel{
width:0;
flex:1;
text-align:center;
white-space:nowrap;
font-weight:900;

/* +30% */
font-size:72px;

transform: translate(-12px,10px) rotate(-60deg);
transform-origin:center;
color:#ffffff;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";
const TARGET=150000;
const REFRESH_MS=90000;
const RANGE="J3:K19";

const chart=document.getElementById("chart");

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){
return text.split("\n").map(r=>r.split(",")).filter(r=>r.length>=2);
}

function toNumber(v){
const s=String(v??"").replace(/\s/g,"").replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;

}

/* ==== Neon colors ==== */

const COLORS=[
["#b100ff","#ff00c8"],
["#ff0048","#ff0055"],
["#ff6a00","#ff2d00"],
["#ffe600","#ffd000"]
];

function draw3DBar(ctx,x,y,w,h,i){

const depth=10;

const grad=ctx.createLinearGradient(0,y,0,y+h);
grad.addColorStop(0,COLORS[i%COLORS.length][0]);
grad.addColorStop(1,COLORS[i%COLORS.length][1]);

ctx.fillStyle=grad;
ctx.fillRect(x,y,w,h);

/* top */

ctx.fillStyle="rgba(255,255,255,.25)";
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+depth,y-depth);
ctx.lineTo(x+w,y-depth);
ctx.lineTo(x+w-depth,y);
ctx.closePath();
ctx.fill();

/* side */

ctx.fillStyle="rgba(0,0,0,.3)";
ctx.beginPath();
ctx.moveTo(x+w,y);
ctx.lineTo(x+w,y+h);
ctx.lineTo(x+w+depth,y+h-depth);
ctx.lineTo(x+w+depth,y-depth);
ctx.closePath();
ctx.fill();

}

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));
items.sort((a,b)=>b.value-a.value);

const total=items.reduce((s,i)=>s+i.value,0);
const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

chart.innerHTML=`
<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">
<canvas></canvas>
</div>

<div class="xlabels">
${items.map(it=>`<div class="xlabel">${it.name}</div>`).join("")}
</div>

</div>
`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);

const pad=20;
const W=rect.width-pad*2;
const H=rect.height-pad*2;

const n=items.length;
const gap=25;
const barW=(W-gap*(n-1))/n;

let startX=pad;

items.forEach((it,i)=>{

const pct=it.value/axisMax;
const h=pct*H;

const x=startX+i*(barW+gap);
const y=pad+(H-h);

ctx.fillStyle="#fff";
ctx.font="800 42px Arial";
ctx.textAlign="center";
ctx.fillText(it.value,x+barW/2,y-10);

draw3DBar(ctx,x,y,barW,h,i);

});

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());
const data=parseCSV(text);
renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
