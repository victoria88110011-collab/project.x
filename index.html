<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>

<title>Bonus Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#020617;
font-family:'Inter',sans-serif;
color:#14b8d4;
position:relative;
}

/* фон */

body::after{
content:"";
position:fixed;
inset:0;
background-image:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2000&q=80");
background-size:cover;
background-position:center;
opacity:0.15;
filter:blur(2px) brightness(0.35);
z-index:-1;
}

/* HUD сетка */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#0ea5e9 1px, transparent 1px),
linear-gradient(90deg,#0ea5e9 1px, transparent 1px);
background-size:80px 80px;
opacity:.05;
z-index:0;
}

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows:
90px
1fr
15vh;

padding:24px;
box-sizing:border-box;
}

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:72px;
font-weight:900;
letter-spacing:3px;
color:#e5e7eb;
background:linear-gradient(180deg,#020617,#000);
border-radius:14px;
box-shadow:
0 0 25px rgba(0,255,255,.35),
inset 0 0 20px rgba(0,255,255,.15);
}

/* CHART */

.plot{
position:relative;
border-radius:14px;
border:1px solid rgba(0,255,255,.2);
background:
linear-gradient(to bottom, rgba(0,255,255,.10) 1px, transparent 1px);
background-size:100% 20%;
box-shadow:
0 0 30px rgba(0,255,255,.12),
inset 0 0 30px rgba(0,255,255,.12);
overflow:hidden;
}

canvas{
width:100%;
height:100%;
display:block;
}

.labelsLayer{
position:relative;
height:100%;
}

}

.speedo{

right:60px;

border-radius:50%;
background: radial-gradient(circle,#020617 40%,#000 100%);
border:2px solid rgba(34,211,238,.4);

0 0 25px rgba(34,211,238,.4),

</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";
const RANGE="J3:K19";
const REFRESH_MS=90000;

const chart=document.getElementById("chart");

/* CSV */

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;

}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);

}

function toNumber(v){
const s=String(v??"")
.replace(/\s/g,"")
.replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

/* SCALE */

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;
}

/* BAR */

function drawBar(ctx,x,y,w,h,index){

const palettes=[
["#67e8f9","#22d3ee","#0891b2","#075985"],
["#60a5fa","#3b82f6","#2563eb","#1e3a8a"],
["#a78bfa","#8b5cf6","#7c3aed","#4c1d95"],
["#f472b6","#ec4899","#be185d","#831843"],
["#34d399","#10b981","#059669","#064e3b"]
];

const p=palettes[index%palettes.length];

const gradient=ctx.createLinearGradient(0,y,0,y+h);

gradient.addColorStop(0,p[0]);
gradient.addColorStop(.35,p[1]);
gradient.addColorStop(.75,p[2]);
gradient.addColorStop(1,p[3]);

ctx.fillStyle=gradient;

ctx.shadowColor=p[1];
ctx.shadowBlur=18;

ctx.fillRect(x,y,w,h);

ctx.shadowBlur=0;

ctx.fillStyle="rgba(255,255,255,0.15)";
ctx.fillRect(x+2,y+2,w*0.15,h*0.9);

return p[1];
}

/* SPEEDOMETER */

function drawSpeedometer(value,max){

const canvas=document.getElementById("speedo");
if(!canvas) return;

const rect=canvas.parentElement.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

const ctx=canvas.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);

const w=rect.width;
const h=rect.height;

const cx=w/2;
const cy=h/2;

/* внутренний отступ от края */
const margin = 140;

const r = Math.min(w,h)/2 - margin;

/* фон шкалы */

ctx.lineWidth=40;
ctx.strokeStyle="rgba(34,211,238,.25)";
ctx.beginPath();
ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
ctx.stroke();

/* деления */

const steps=4;

ctx.fillStyle="#e5e7eb";
ctx.font="700 46px Inter";
ctx.textAlign="center";

for(let i=0;i<=steps;i++){

const pct=i/steps;

const angle=Math.PI*0.75 + pct*Math.PI*1.5;

const x1=cx+Math.cos(angle)*(r-10);
const y1=cy+Math.sin(angle)*(r-10);

const x2=cx+Math.cos(angle)*(r+8);
const y2=cy+Math.sin(angle)*(r+8);

/* линия деления */

ctx.lineWidth=8;
ctx.strokeStyle="#22d3ee";

ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();

/* подпись */

const labelValue=(max/steps)*i;

let text;

if(labelValue===0){
text="0";
}
else if(labelValue>=1000000){
text=(labelValue/1000000).toFixed(1)+"M";
}
else{
text=(labelValue/1000)+"k";
}

const lx=cx+Math.cos(angle)*(r+60);
const ly=cy+Math.sin(angle)*(r+60);

ctx.fillText(text,lx,ly);

}

/* прогресс */

const pct=Math.min(value/max,1);

ctx.strokeStyle="#22d3ee";
ctx.shadowColor="#22d3ee";
ctx.shadowBlur=20;
ctx.lineWidth=40;   // ← +50% от 30

ctx.beginPath();
ctx.arc(
cx,
cy,
r,
Math.PI*0.75,
Math.PI*0.75 + pct*Math.PI*1.5
);
ctx.stroke();

ctx.shadowBlur=0;

/* стрелка */

const angle=Math.PI*0.75 + pct*Math.PI*1.5;

const px=cx+Math.cos(angle)*(r-15);
const py=cy+Math.sin(angle)*(r-15);

ctx.lineWidth=10;
ctx.strokeStyle="#67e8f9";

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(px,py);
ctx.stroke();

/* центр */

ctx.fillStyle="#22d3ee";
ctx.beginPath();
ctx.arc(cx,cy,6,0,Math.PI*2);
ctx.fill();

/* значение */

ctx.fillStyle="#e5e7eb";
ctx.textAlign="center";

/* TOTAL */
ctx.font="700 54px Inter";
ctx.fillText(value.toLocaleString(),cx,cy+60);

/* DASH */
ctx.font="700 44px Inter";
ctx.fillText("—",cx,cy+115);

/* GOAL */
ctx.font="600 50px Inter";
ctx.fillText(max.toLocaleString(),cx,cy+170);
}

/* RENDER */

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));

items.sort((a,b)=>b.value-a.value);

const total = items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

chart.innerHTML=`

<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">
<canvas></canvas>

<div class="speedo">
<canvas id="speedo"></canvas>
</div>

</div>

<div class="labelsLayer"></div>

</div>

`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");
const labelsLayer=chart.querySelector(".labelsLayer");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

const ctx=canvas.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);

ctx.clearRect(0,0,rect.width,rect.height);

const padL=20,padR=20,padT=20,padB=30;

const W=rect.width-padL-padR;
const H=rect.height-padT-padB;

const n=items.length;
const gap=8;

const barW=Math.max(10,Math.floor((W-gap*(n-1))/n));
const totalW=n*barW+(n-1)*gap;

let startX=padL+(W-totalW)/2;

labelsLayer.innerHTML="";

items.forEach((it,i)=>{

let pct=(it.value/axisMax)*100;

const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=padT+(H-h);

const barColor=drawBar(ctx,x,y,barW,h,i);

/* VALUE */

const text=it.value.toLocaleString();

ctx.font="900 70px Inter";
ctx.textAlign="center";

ctx.lineWidth=6;
ctx.strokeStyle="#00151f";
ctx.strokeText(text,x+barW/2,y-14);

ctx.fillStyle="#e5e7eb";
ctx.shadowColor=barColor;
ctx.shadowBlur=10;
ctx.fillText(text,x+barW/2,y-14);
ctx.shadowBlur=0;

/* LABEL */

const label=document.createElement("div");

label.className="xlabel";

/* автоматический перенос имени */
label.innerHTML = it.name.replace(" ","<br>");

label.style.left=(x+barW/2)+"px";
label.style.fontSize="85px";

labelsLayer.appendChild(label);

});

/* цель 1.6M */

drawSpeedometer(total,1600000);

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());
const data=parseCSV(text);

renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
