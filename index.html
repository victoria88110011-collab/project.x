<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#020617;
font-family:'Inter',sans-serif;
}

/* фон */

body::after{
content:"";
position:fixed;
inset:0;
background-image:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2000&q=80");
background-size:cover;
background-position:center;
opacity:0.15;
filter:blur(2px) brightness(0.35);
z-index:-1;
}

/* сетка */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#0ea5e9 1px, transparent 1px),
linear-gradient(90deg,#0ea5e9 1px, transparent 1px);
background-size:80px 80px;
opacity:.05;
z-index:0;
}

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows:90px 1fr 15vh;
gap:16px;
padding:24px;
box-sizing:border-box;
}

/* TOTAL */

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:84px;
font-weight:900;
letter-spacing:4px;
color:#e5e7eb;
background:linear-gradient(180deg,#020617,#000);
border-radius:14px;
box-shadow:
0 0 25px rgba(0,255,255,.35),
inset 0 0 20px rgba(0,255,255,.15);
}

/* CHART */

.plot{
position:relative;
border-radius:14px;
border:1px solid rgba(0,255,255,.2);
background:
linear-gradient(to bottom, rgba(0,255,255,.10) 1px, transparent 1px);
background-size:100% 20%;
box-shadow:
0 0 30px rgba(0,255,255,.12),
inset 0 0 30px rgba(0,255,255,.12);
overflow:hidden;
}

canvas{
width:100%;
height:100%;
display:block;
}

/* LABELS */

.labelsLayer{
position:relative;
height:100%;
}

.xlabel{
position:absolute;
left:0;
top:50%;
transform:translate(-50%,-50%) rotate(-75deg);
font-size:60px;
font-weight:900;
color:#e5e7eb;
white-space:nowrap;
pointer-events:none;
}

/* SPEEDO */

.speedo{
position:absolute;
right:60px;
top:40px;
width:984px;
height:984px;
border-radius:50%;
background: radial-gradient(circle,#020617 40%,#000 100%);
border:2px solid rgba(34,211,238,.4);
box-shadow:
0 0 25px rgba(34,211,238,.4),
inset 0 0 25px rgba(34,211,238,.25);
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

/* CONFIG */

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";
const RANGE="J3:K19";
const REFRESH_MS=120000;

/* STATE */

const chart=document.getElementById("chart");

let canvas, ctx;
let speedCanvas, speedCtx;
let labelsLayer;
let items=[];

/* INIT UI */

function initUI(){

chart.innerHTML=`
<div class="vwrap">

<div class="cap" id="total">TOTAL 0</div>

<div class="plot">
<canvas id="bars"></canvas>

<div class="speedo">
<canvas id="speedo"></canvas>
</div>
</div>

<div class="labelsLayer"></div>

</div>
`;

canvas=document.getElementById("bars");
ctx=canvas.getContext("2d");

speedCanvas=document.getElementById("speedo");
speedCtx=speedCanvas.getContext("2d");

labelsLayer=chart.querySelector(".labelsLayer");

window.addEventListener("resize", redraw);
}

/* CSV */

function csvUrl(){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}`;
}

function parseCSV(text){
return text.split("\n")
.map(r=>r.split(","))
.filter(r=>r.length>=2);
}

function toNumber(v){
return Number(String(v).replace(/\s/g,"").replace(",","."))||0;
}

/* UPDATE */

function updateChart(data){

items=data.map(r=>({name:r[0],value:toNumber(r[1])}));
items.sort((a,b)=>b.value-a.value);

const total=items.reduce((s,i)=>s+i.value,0);

document.getElementById("total").innerText=
"TOTAL "+total.toLocaleString();

redraw();
}

/* DRAW */

function redraw(){

const plot=chart.querySelector(".plot");
const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const pad=40;
const W=rect.width-pad*2;
const H=rect.height-pad*2;

const gap=12;

/* ширина */
const barW=(W-gap*(items.length-1))/items.length;

/* высота уменьшена */
const heightScale=0.8;

const max=Math.max(...items.map(x=>x.value),1);

labelsLayer.innerHTML="";

items.forEach((it,i)=>{

const h=(it.value/max)*H*heightScale;

const x=pad+i*(barW+gap);
const y=pad+(H-h);

const g=ctx.createLinearGradient(0,y,0,y+h);
g.addColorStop(0,"#67e8f9");
g.addColorStop(1,"#0891b2");

ctx.fillStyle=g;
ctx.fillRect(x,y,barW,h);

/* value */

const text = it.value.toLocaleString();

ctx.font="900 56px Inter";
ctx.textAlign="center";

ctx.lineWidth=8;
ctx.strokeStyle="#00151f";
ctx.strokeText(text, x+barW/2, y-20);

ctx.fillStyle="#e5e7eb";
ctx.fillText(text, x+barW/2, y-20);

/* label */

const label=document.createElement("div");
label.className="xlabel";
label.innerHTML=it.name.replace(" ","<br>");
label.style.left=(x+barW/2)+"px";

labelsLayer.appendChild(label);

});

drawSpeedo(items.reduce((s,i)=>s+i.value,0),1600000);
}

/* SPEEDO */

function drawSpeedometer(value,max){

const canvas=document.getElementById("speedo");
if(!canvas) return;

const rect=canvas.parentElement.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

const ctx=canvas.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);

const w=rect.width;
const h=rect.height;

const cx = w / 2;
const cy = h / 2;

/* расстояние для текста шкалы */
const labelOffset = rect.width * 0.15;

/* радиус с учетом текста */
const r = Math.min(w, h) / 2 - labelOffset - 40;

/* фон шкалы */

ctx.lineWidth=40;
ctx.strokeStyle="rgba(34,211,238,.25)";
ctx.beginPath();
ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
ctx.stroke();

/* деления */

const steps=4;

ctx.fillStyle="#e5e7eb";
ctx.font="700 46px Inter";
ctx.textAlign="center";

for(let i=0;i<=steps;i++){

const pct=i/steps;

const angle=Math.PI*0.75 + pct*Math.PI*1.5;

const x1=cx+Math.cos(angle)*(r-10);
const y1=cy+Math.sin(angle)*(r-10);

const x2=cx+Math.cos(angle)*(r+8);
const y2=cy+Math.sin(angle)*(r+8);

/* линия деления */

ctx.lineWidth=8;
ctx.strokeStyle="#22d3ee";

ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();

/* подпись */

const labelValue=(max/steps)*i;

let text;

if(labelValue===0){
text="0";
}
else if(labelValue>=1000000){
text=(labelValue/1000000).toFixed(1)+"M";
}
else{
text=(labelValue/1000)+"k";
}

/* одинаковая дистанция текста от дуги */

const labelRadius = r + rect.width * 0.15;

const lx = cx + Math.cos(angle) * labelRadius;
const ly = cy + Math.sin(angle) * labelRadius;

ctx.textBaseline = "middle";
ctx.textAlign = "center";

ctx.fillText(text, lx, ly);

}

/* прогресс */

const pct=Math.min(value/max,1);

ctx.strokeStyle="#22d3ee";
ctx.shadowColor="#22d3ee";
ctx.shadowBlur=10;
ctx.lineWidth=40;   // ← +50% от 30

ctx.beginPath();
ctx.arc(
cx,
cy,
r,
Math.PI*0.75,
Math.PI*0.75 + pct*Math.PI*1.5
);
ctx.stroke();

ctx.shadowBlur=0;

/* стрелка */

const angle=Math.PI*0.75 + pct*Math.PI*1.5;

const px=cx+Math.cos(angle)*(r-80);
const py=cy+Math.sin(angle)*(r-80);

ctx.lineWidth=10;
ctx.strokeStyle="#67e8f9";

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(px,py);
ctx.stroke();

/* центр */

ctx.fillStyle="#22d3ee";
ctx.beginPath();
ctx.arc(cx,cy,6,0,Math.PI*2);
ctx.fill();

/* значение */

ctx.fillStyle="#e5e7eb";
ctx.textAlign="center";

/* TOTAL */
ctx.font="700 54px Inter";
ctx.fillText(value.toLocaleString(),cx,cy+60);

/* DASH */
ctx.font="700 44px Inter";
ctx.fillText("—",cx,cy+115);

/* GOAL */
ctx.font="600 50px Inter";
ctx.fillText(max.toLocaleString(),cx,cy+170);
}
/* LOAD */

async function load(){

try{
const text=await fetch(csvUrl(),{cache:"no-store"}).then(r=>r.text());
const data=parseCSV(text);
updateChart(data);
}catch(e){
console.log("error",e);
}

}

/* INIT */

initUI();
load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
