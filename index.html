<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agents Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#fff;
font-family:Arial, sans-serif;
}

.wrap{
height:100vh;
display:flex;
flex-direction:column;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 18px;
border-bottom:1px solid #eee;
}

.title{
font-size:22px;
font-weight:800;
}

.status{
font-size:16px;
opacity:.7;
}

.chartArea{
flex:1;
padding:16px;
box-sizing:border-box;
}

.card{
height:100%;
border:1px solid #eee;
border-radius:14px;
padding:14px;
box-sizing:border-box;
display:flex;
flex-direction:column;
}

.card h2{
margin:0 0 10px 0;
font-size:22px;
}

.chartHost{
flex:1;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows: calc(100% - 140px) 140px;
gap:8px;
}

.plot{
position:relative;
border:1px solid #eee;
border-radius:12px;
overflow:hidden;
background:
linear-gradient(to bottom, rgba(0,0,0,.08) 1px, transparent 1px);
background-size:100% 20%;
}

canvas{
width:100%;
height:100%;
display:block;
}

/* подписи снизу */

.xlabels{
display:flex;
justify-content:center;
gap:18px;
padding-top:18px;
}

.xlabel{
width:80px;
text-align:center;
font-weight:900;
font-size:42px;

transform:rotate(-60deg);
transform-origin:bottom center;
}

/* числа сверху */

.valueLabel{
position:absolute;
font-weight:900;
font-size:48px;
transform:translateX(-50%);
}

</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
<div class="title">Agents dashboard</div>
<div class="status" id="status">Загрузка…</div>
</div>

<div class="chartArea">

<div class="card">

<h2>Agents</h2>

<div id="chart" class="chartHost"></div>

</div>

</div>

</div>

<script>

const SPREADSHEET_ID="1d801Kn2bLsQeg4ftU3oeWQXgvA6B5GsGkjzEwjeh1b8"
const GID="119792443"

const RANGE="C3:D19"

const REFRESH_MS=90000

const chart=document.getElementById("chart")
const statusEl=document.getElementById("status")

function csvUrl(){

return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}&t=${Date.now()}`

}

function parseCSV(text){

if(text.charCodeAt(0)===0xFEFF) text=text.slice(1)

return text.split("\n").map(r=>r.split(","))

}

function toNumber(v){

const s=String(v).replace(/\s/g,"").replace(",",".")
const n=Number(s)

return Number.isFinite(n)?n:0

}

function niceMax(v){

if(v<=0)return 1

const exp=Math.pow(10,Math.floor(Math.log10(v)))
const frac=v/exp

let nice

if(frac<=1)nice=1
else if(frac<=2)nice=2
else if(frac<=5)nice=5
else nice=10

return nice*exp

}

function renderChart(rows){

const items=rows.map(r=>({

name:r[0],
value:toNumber(r[1])

}))

items.sort((a,b)=>b.value-a.value)

const maxData=Math.max(...items.map(x=>x.value))
const axisMax=niceMax(maxData)

chart.innerHTML=`

<div class="vwrap">

<div class="plot">
<canvas></canvas>
</div>

<div class="xlabels">
${items.map(i=>`<div class="xlabel">${i.name}</div>`).join("")}
</div>

</div>
`

const canvas=chart.querySelector("canvas")
const plot=chart.querySelector(".plot")

const rect=plot.getBoundingClientRect()

const dpr=window.devicePixelRatio||1

canvas.width=rect.width*dpr
canvas.height=rect.height*dpr

canvas.style.width=rect.width+"px"
canvas.style.height=rect.height+"px"

const ctx=canvas.getContext("2d")
ctx.setTransform(dpr,0,0,dpr,0,0)

const padL = 20
const padR = 20
const padT = 20
const padB = 110

const W=rect.width-padL-padR
const H=rect.height-padT-padB

const gap=18

const barW=(W-gap*(items.length-1))/items.length

let startX=padL

items.forEach((it,i)=>{

const pct=it.value/axisMax
const h=pct*H

const x=startX+i*(barW+gap)
const y=padT+(H-h)

ctx.fillStyle="#1f2937"
ctx.fillRect(x,y,barW,h)

ctx.fillStyle="#000"
ctx.font="bold 40px Arial"
ctx.textAlign="center"

ctx.fillText(it.value,x+barW/2,y-6)

})

}

async function load(){

try{

statusEl.textContent="Загрузка..."

const text=await fetch(csvUrl(),{cache:"no-store"}).then(r=>r.text())

const rows=parseCSV(text)

renderChart(rows)

statusEl.textContent="Обновлено "+new Date().toLocaleTimeString()

}catch(e){

statusEl.textContent="Ошибка"

}

}

load()

setInterval(load,REFRESH_MS)

window.addEventListener("resize",load)

</script>

</body>
</html>
