<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#020617;
font-family:'Inter',sans-serif;
color:#e5e7eb;
overflow:hidden;
}

/* контейнер */

.wrap{
display:grid;
grid-template-rows:80px 1fr;
height:100%;
padding:20px;
box-sizing:border-box;
gap:10px;
}

/* total */

.total{
text-align:center;
font-size:48px;
font-weight:800;
}

/* chart */

.plot{
position:relative;
height:100%;
border:1px solid rgba(0,255,255,.2);
border-radius:10px;
}

/* speedometer */

.speedo{
position:absolute;
right:20px;
top:20px;
width:300px;
height:300px;
}

canvas{
display:block;
width:100%;
height:100%;
}

</style>
</head>

<body>

<div class="wrap">
  <div id="total" class="total">TOTAL 0</div>

  <div class="plot">
    <canvas id="bars"></canvas>
    <canvas id="speedo" class="speedo"></canvas>
  </div>
</div>

<script>

/* CONFIG */

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";
const RANGE="J3:K19";

const REFRESH_MS=300000; // 5 минут

/* STATE */

let barsCanvas = document.getElementById("bars");
let speedCanvas = document.getElementById("speedo");

let barsCtx = barsCanvas.getContext("2d");
let speedCtx = speedCanvas.getContext("2d");

/* UTILS */

function csvUrl(){
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}`;
}

function parseCSV(text){
  return text.split("\n")
    .map(r=>r.split(","))
    .filter(r=>r.length>=2);
}

function toNumber(v){
  return Number(String(v).replace(/\s/g,"").replace(",",".")) || 0;
}

function niceMax(v){
  const exp=Math.pow(10,Math.floor(Math.log10(v)));
  const frac=v/exp;
  if(frac<=1) return exp;
  if(frac<=2) return 2*exp;
  if(frac<=5) return 5*exp;
  return 10*exp;
}

/* RESIZE */

function resizeCanvas(canvas){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  return ctx;
}

/* DRAW BARS */

function drawBars(data){

  barsCtx = resizeCanvas(barsCanvas);

  const W = barsCanvas.clientWidth;
  const H = barsCanvas.clientHeight;

  barsCtx.clearRect(0,0,W,H);

  const max = niceMax(Math.max(...data.map(d=>d.value),1));

  const barW = W / data.length * 0.6;
  const gap = W / data.length * 0.4;

  data.forEach((d,i)=>{

    const x = i*(barW+gap)+gap/2;
    const h = (d.value/max)*H;
    const y = H-h;

    barsCtx.fillStyle = "#22d3ee";
    barsCtx.fillRect(x,y,barW,h);

    barsCtx.fillStyle="#fff";
    barsCtx.font="20px Inter";
    barsCtx.textAlign="center";

    barsCtx.fillText(
      d.value.toLocaleString(),
      x+barW/2,
      y-5
    );

  });

}

/* DRAW SPEEDO */

function drawSpeedo(value,max){

  speedCtx = resizeCanvas(speedCanvas);

  const W = speedCanvas.clientWidth;
  const H = speedCanvas.clientHeight;

  const cx=W/2;
  const cy=H/2;
  const r=Math.min(W,H)/2 - 20;

  speedCtx.clearRect(0,0,W,H);

  /* base */

  speedCtx.strokeStyle="rgba(255,255,255,.2)";
  speedCtx.lineWidth=10;

  speedCtx.beginPath();
  speedCtx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
  speedCtx.stroke();

  /* progress */

  const pct=Math.min(value/max,1);

  speedCtx.strokeStyle="#22d3ee";
  speedCtx.beginPath();
  speedCtx.arc(
    cx,cy,r,
    Math.PI*0.75,
    Math.PI*0.75 + pct*Math.PI*1.5
  );
  speedCtx.stroke();

  /* needle */

  const angle=Math.PI*0.75 + pct*Math.PI*1.5;

  const px=cx+Math.cos(angle)*(r-20);
  const py=cy+Math.sin(angle)*(r-20);

  speedCtx.strokeStyle="#fff";
  speedCtx.lineWidth=3;

  speedCtx.beginPath();
  speedCtx.moveTo(cx,cy);
  speedCtx.lineTo(px,py);
  speedCtx.stroke();

}

/* UPDATE */

function updateChart(rows){

  const data = rows.map(r=>({
    name:r[0],
    value:toNumber(r[1])
  })).sort((a,b)=>b.value-a.value);

  const total = data.reduce((s,d)=>s+d.value,0);

  document.getElementById("total").innerText =
    "TOTAL " + total.toLocaleString();

  drawBars(data);
  drawSpeedo(total,1600000);

}

/* LOAD */

async function load(){

  try{
    const res = await fetch(csvUrl(), {cache:"no-store"});
    const text = await res.text();

    const rows = parseCSV(text);

    updateChart(rows);

  }catch(e){
    console.error("LOAD ERROR", e);
  }

}

/* INIT */

window.addEventListener("resize", ()=>{
  load(); // просто перерисовка
});

load();
setInterval(load, REFRESH_MS);

</script>

</body>
</html>
