<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#0b1220;
font-family:Arial,sans-serif;
color:#fff;
}

.chartHost{
width:100vw;
height:100vh;
}

/* ===== Layout ===== */

.vwrap{
height:100%;
display:grid;
grid-template-rows:80px 2fr 1fr;
gap:10px;
padding:20px;
box-sizing:border-box;
}

/* ===== TOTAL ===== */

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
font-weight:900;

background:linear-gradient(180deg,#1f2937,#020617);
border-radius:16px;

box-shadow:
0 20px 60px rgba(0,0,0,.6),
inset 0 0 30px rgba(255,255,255,.05);

letter-spacing:2px;
}

/* ===== Plot ===== */

.plot{
position:relative;
border-radius:16px;
overflow:hidden;

background:
linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);

background-size:100% 20%;

box-shadow:
inset 0 0 40px rgba(0,0,0,.8),
0 20px 60px rgba(0,0,0,.5);
}

canvas{
width:100%;
height:100%;
display:block;
}

/* ===== Target ===== */

.targetLine{
position:absolute;
left:0;
right:0;
height:2px;
background:#ff3b6b;
box-shadow:0 0 10px #ff3b6b;
}

.targetLabel{
position:absolute;
right:10px;
font-size:14px;
font-weight:900;
color:#ff3b6b;
background:#020617;
padding:4px 8px;
border-radius:6px;
}

/* ===== Labels ===== */

.xlabels{
display:flex;
justify-content:center;
align-items:flex-start;
gap:8px;
padding-top:10px;
}

.xlabel{
flex:1;
text-align:center;
font-weight:900;
font-size:70px;
color:#e5e7eb;

transform:translate(-12px,10px) rotate(-60deg);
transform-origin:center;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const TARGET=150000;
const RANGE="J3:K19";
const REFRESH_MS=90000;

const chart=document.getElementById("chart");

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){

return text
.trim()
.split("\n")
.map(r=>r.split(","))
.filter(r=>r.length>=2);

}

function toNumber(v){
const s=String(v).replace(/\s/g,"").replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

function niceMax(v){

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

if(frac<=1)return 1*exp;
if(frac<=2)return 2*exp;
if(frac<=5)return 5*exp;
return 10*exp;

}

/* ===== Render ===== */

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));

items.sort((a,b)=>b.value-a.value);

const total=items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(...items.map(x=>x.value));
const axisMax=niceMax(maxData);

const targetPct=(TARGET/axisMax)*100;

chart.innerHTML=`
<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">

<div class="targetLine" style="bottom:${targetPct}%"></div>
<div class="targetLabel" style="bottom:${targetPct}%">TARGET ${TARGET}</div>

<canvas></canvas>

</div>

<div class="xlabels">
${items.map(i=>`<div class="xlabel">${i.name}</div>`).join("")}
</div>

</div>
`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const pad=40;
const W=rect.width-pad*2;
const H=rect.height-pad*2;

const n=items.length;
const gap=20;
const barW=(W-gap*(n-1))/n;

let startX=pad;

const points=[];

/* ===== Bars ===== */

items.forEach((it,i)=>{

const pct=(it.value/axisMax);
const h=pct*H;

const x=startX+i*(barW+gap);
const y=rect.height-pad-h;

/* gradient */

const g=ctx.createLinearGradient(0,y,0,y+h);
g.addColorStop(0,"#6ee7ff");
g.addColorStop(1,"#4f46e5");

ctx.fillStyle=g;

ctx.shadowBlur=20;
ctx.shadowColor="#38bdf8";

ctx.fillRect(x,y,barW,h);

ctx.shadowBlur=0;

/* value */

ctx.fillStyle="#fff";
ctx.font="bold 28px Arial";
ctx.textAlign="center";

ctx.fillText(it.value.toLocaleString(),x+barW/2,y-10);

points.push({
x:x+barW/2,
y:y
});

});

/* ===== Line graph ===== */

ctx.beginPath();

points.forEach((p,i)=>{
if(i===0)ctx.moveTo(p.x,p.y);
else ctx.lineTo(p.x,p.y);
});

ctx.strokeStyle="#7dd3fc";
ctx.lineWidth=3;
ctx.shadowBlur=10;
ctx.shadowColor="#7dd3fc";
ctx.stroke();

ctx.shadowBlur=0;

/* points */

points.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,5,0,Math.PI*2);
ctx.fillStyle="#38bdf8";
ctx.fill();
});

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());

const data=parseCSV(text);

renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
