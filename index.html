<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#020617;
font-family:'Inter',sans-serif;
color:#14b8d4;
}

/* фон */

body::after{
content:"";
position:fixed;
inset:0;
background-image:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2000&q=80");
background-size:cover;
background-position:center;
opacity:0.15;
filter:blur(2px) brightness(0.35);
z-index:-1;
}

/* HUD сетка */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#0ea5e9 1px, transparent 1px),
linear-gradient(90deg,#0ea5e9 1px, transparent 1px);
background-size:80px 80px;
opacity:.05;
z-index:0;
}

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows:90px 1fr 15vh;
gap:16px;
padding:24px;
box-sizing:border-box;
}

/* TOTAL */

.cap{
display:flex;
justify-content:center;
align-items:center;

font-size:84px;          /* было 72 → увеличили */
font-weight:900;
letter-spacing:4px;     /* чуть шире */

color:#e5e7eb;

/* ГЛАВНОЕ — СВЕЧЕНИЕ ТЕКСТА */
text-shadow:
0 2px 4px rgba(0,0,0,0.9),
0 0 12px rgba(34,211,238,0.7),
0 0 30px rgba(34,211,238,0.5);

background:linear-gradient(180deg,#020617,#000);

border-radius:14px;

box-shadow:
0 0 25px rgba(0,255,255,.35),
inset 0 0 20px rgba(0,255,255,.15);
}

/* CHART */

.plot{
position:relative;
border-radius:14px;
border:1px solid rgba(0,255,255,.2);
background:
linear-gradient(to bottom, rgba(0,255,255,.10) 1px, transparent 1px);
background-size:100% 20%;
box-shadow:
0 0 30px rgba(0,255,255,.12),
inset 0 0 30px rgba(0,255,255,.12);
overflow:hidden;
}

canvas{
width:100%;
height:100%;
display:block;
}

/* LABELS */

.labelsLayer{
position:relative;
height:100%;
}

.xlabel{
position:absolute;
left:0;
top:50%;
transform:translate(-50%,-50%) rotate(-75deg);
font-weight:800;
white-space:nowrap;
color:#e5e7eb;
text-shadow:
0 2px 2px rgba(0,0,0,0.8),
0 0 6px rgba(34,211,238,0.5);
pointer-events:none;
}

/* SPEEDO */

.speedo{
position:absolute;
right:60px;
top:40px;
width:600px;
height:600px;
border-radius:50%;
background: radial-gradient(circle,#020617 40%,#000 100%);
border:2px solid rgba(34,211,238,.4);
box-shadow:
0 0 25px rgba(34,211,238,.4),
inset 0 0 25px rgba(34,211,238,.25);
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

/* CONFIG */

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";
const RANGE="J3:K19";
const REFRESH_MS=120000;

/* STATE */

const chart=document.getElementById("chart");

let canvas, ctx;
let speedCanvas, speedCtx;
let labelsLayer;
let items=[];

/* INIT UI */

function initUI(){

chart.innerHTML=`

<div class="vwrap">

<div class="cap" id="total">
TOTAL 0
</div>

<div class="plot">
<canvas id="bars"></canvas>

<div class="speedo">
<canvas id="speedo"></canvas>
</div>

</div>

<div class="labelsLayer"></div>

</div>
`;

canvas=document.getElementById("bars");
ctx=canvas.getContext("2d");

speedCanvas=document.getElementById("speedo");
speedCtx=speedCanvas.getContext("2d");

labelsLayer=chart.querySelector(".labelsLayer");

window.addEventListener("resize", redraw);
}

/* CSV */

function csvUrl(){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${RANGE}`;
}

function parseCSV(text){
return text.split("\n")
.map(r=>r.split(","))
.filter(r=>r.length>=2);
}

function toNumber(v){
return Number(String(v).replace(/\s/g,"").replace(",","."))||0;
}

/* UPDATE */

function updateChart(data){

items=data.map(r=>({name:r[0],value:toNumber(r[1])}));
items.sort((a,b)=>b.value-a.value);

const total=items.reduce((s,i)=>s+i.value,0);

document.getElementById("total").innerText=
"TOTAL "+total.toLocaleString();

redraw();
}

/* DRAW */

function redraw(){

const plot=chart.querySelector(".plot");

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

/* BARS */

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const pad=40;
const W=rect.width-pad*2;
const H=rect.height-pad*2;

const gap=12;
const barW=(W-gap*(items.length-1))/items.length;

const max=Math.max(...items.map(x=>x.value),1);

labelsLayer.innerHTML="";

items.forEach((it,i)=>{

const h=(it.value/max)*H;

const x=pad+i*(barW+gap);
const y=pad+(H-h);

/* gradient */

const g=ctx.createLinearGradient(0,y,0,y+h);
g.addColorStop(0,"#67e8f9");
g.addColorStop(1,"#0891b2");

ctx.fillStyle=g;

/* glow */

ctx.shadowColor="#22d3ee";
ctx.shadowBlur=20;

ctx.fillRect(x,y,barW,h);

ctx.shadowBlur=0;

/* value */

const text = it.value.toLocaleString();

ctx.font="900 56px Inter";
ctx.textAlign="center";

/* ОБВОДКА (глубина) */
ctx.lineWidth=8;
ctx.strokeStyle="#00151f";
ctx.strokeText(text, x+barW/2, y-16);

/* GLOW */
ctx.fillStyle="#e5e7eb";
ctx.shadowColor="#22d3ee";
ctx.shadowBlur=14;

ctx.fillText(text, x+barW/2, y-16);

ctx.shadowBlur=0;

/* label */

const label=document.createElement("div");
label.className="xlabel";
label.innerHTML=it.name.replace(" ","<br>");
label.style.left=(x+barW/2)+"px";

labelsLayer.appendChild(label);

});

/* SPEEDO */

drawSpeedo(items.reduce((s,i)=>s+i.value,0),1600000);

}

/* SPEEDO */

function drawSpeedo(value,max){

const rect=speedCanvas.parentElement.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

speedCanvas.width=rect.width*dpr;
speedCanvas.height=rect.height*dpr;

speedCtx.setTransform(dpr,0,0,dpr,0,0);
speedCtx.clearRect(0,0,rect.width,rect.height);

const cx=rect.width/2;
const cy=rect.height/2;
const r=Math.min(rect.width,rect.height)/2-60;

/* base */

speedCtx.lineWidth=30;
speedCtx.strokeStyle="rgba(34,211,238,.25)";

speedCtx.beginPath();
speedCtx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
speedCtx.stroke();

/* progress */

const pct=Math.min(value/max,1);

speedCtx.strokeStyle="#22d3ee";
speedCtx.shadowColor="#22d3ee";
speedCtx.shadowBlur=25;

speedCtx.beginPath();
speedCtx.arc(
cx,cy,r,
Math.PI*0.75,
Math.PI*0.75+pct*Math.PI*1.5
);
speedCtx.stroke();

speedCtx.shadowBlur=0;

/* needle */

const a=Math.PI*0.75+pct*Math.PI*1.5;

speedCtx.lineWidth=6;
speedCtx.strokeStyle="#67e8f9";

speedCtx.beginPath();
speedCtx.moveTo(cx,cy);
speedCtx.lineTo(
cx+Math.cos(a)*(r-80),
cy+Math.sin(a)*(r-80)
);
speedCtx.stroke();

/* center */

speedCtx.fillStyle="#22d3ee";
speedCtx.beginPath();
speedCtx.arc(cx,cy,6,0,Math.PI*2);
speedCtx.fill();

/* text */

speedCtx.fillStyle="#e5e7eb";
speedCtx.textAlign="center";

speedCtx.font="700 40px Inter";
speedCtx.fillText(value.toLocaleString(),cx,cy+40);

}

/* LOAD */

async function load(){

try{
const text=await fetch(csvUrl(),{cache:"no-store"}).then(r=>r.text());
const data=parseCSV(text);
updateChart(data);
}catch(e){
console.log("error",e);
}

}

/* INIT */

initUI();
load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
