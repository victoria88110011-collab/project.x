<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Chart</title>

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#05070d;
font-family:Arial,sans-serif;
color:#fff;
}

.chartHost{
width:100vw;
height:100vh;
}

/* ==== Layout ==== */

.vwrap{
height:100%;
display:grid;
grid-template-rows:80px 2fr 1fr;
gap:10px;
padding:20px;
box-sizing:border-box;
}

/* ==== TOTAL ==== */

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
font-weight:900;
background:linear-gradient(180deg,#1f2937,#020617);
border-radius:16px;
box-shadow:
0 10px 40px rgba(0,0,0,.6),
inset 0 0 20px rgba(255,255,255,.05);
letter-spacing:2px;
}

/* ==== Chart ==== */

.plot{
position:relative;
border-radius:14px;
overflow:hidden;

background:
radial-gradient(circle at center,#0f172a,#020617);

box-shadow:
inset 0 0 80px rgba(0,0,0,.9);
}

canvas{
width:100%;
height:100%;
display:block;
}

/* ==== target ==== */

.targetLabel{
position:absolute;
right:10px;
font-size:14px;
font-weight:900;
color:#ff4d4d;
background:rgba(0,0,0,.6);
padding:3px 8px;
border-radius:20px;
}

.targetLine{
position:absolute;
left:0;
right:0;
height:2px;
background:#ff4d4d;
box-shadow:0 0 10px #ff4d4d;
}

/* ==== Labels ==== */

.xlabels{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:6px 10px 0 10px;
}

.xlabel{
flex:1;
text-align:center;
white-space:nowrap;
font-weight:900;
font-size:55px;
color:#cbd5f5;
transform: translate(-12px,10px) rotate(-60deg);
transform-origin:center;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const TARGET=150000;
const REFRESH_MS=90000;
const RANGE="J3:K19";

const chart=document.getElementById("chart");

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;

}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);

}

function toNumber(v){
const s=String(v??"").replace(/\s/g,"").replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;

}

/* ==== Neon Cylinder Bar ==== */

function drawCylinder(ctx,x,y,w,h){

const r=w/2;

const grad=ctx.createLinearGradient(x,0,x+w,0);
grad.addColorStop(0,"#1e3a8a");
grad.addColorStop(0.4,"#3b82f6");
grad.addColorStop(0.6,"#60a5fa");
grad.addColorStop(1,"#1e3a8a");

ctx.fillStyle=grad;

ctx.fillRect(x,y,w,h);

/* top ellipse */

ctx.beginPath();
ctx.ellipse(x+r,y,r,r*0.4,0,0,Math.PI*2);
ctx.fill();

/* glow */

ctx.shadowColor="#3b82f6";
ctx.shadowBlur=20;
ctx.fillRect(x,y,w,h);
ctx.shadowBlur=0;

}

/* ==== Render ==== */

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));
items.sort((a,b)=>b.value-a.value);

const total = items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

const targetPct=(TARGET/axisMax)*100;

chart.innerHTML=`

<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">

<div class="targetLine" style="bottom:${targetPct}%"></div>
<div class="targetLabel" style="bottom:${targetPct}%">ЦЕЛЬ ${TARGET}</div>

<canvas></canvas>

</div>

<div class="xlabels">
${items.map(it=>`<div class="xlabel">${it.name}</div>`).join("")}
</div>

</div>

`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");

function redraw(){

const rect=plot.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,rect.width,rect.height);

const padL=20,padR=20,padT=20,padB=30;

const W=rect.width-padL-padR;
const H=rect.height-padT-padB;

const n=items.length;
const gap=16;

const barW=Math.max(20,Math.floor((W-gap*(n-1))/n));

const totalW=n*barW+(n-1)*gap;
let startX=padL+(W-totalW)/2;

items.forEach((it,i)=>{

const pct=(it.value/axisMax)*100;
const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=padT+(H-h);

/* value */

ctx.fillStyle="#ffffff";
ctx.font="800 48px Arial";
ctx.textAlign="center";

ctx.fillText(it.value,x+barW/2,y-10);

/* bar */

drawCylinder(ctx,x,y,barW,h);

});

}

redraw();
window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());
const data=parseCSV(text);

renderChart(data);

}

load();
setInterval(load,REFRESH_MS);

</script>

</body>
</html>
