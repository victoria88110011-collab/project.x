<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#020617;
font-family:'Inter',sans-serif;
color:#14b8d4;
}

/* GRID */

body::before{

content:"";
position:fixed;
inset:0;

background:
linear-gradient(#0ea5e9 1px, transparent 1px),
linear-gradient(90deg,#0ea5e9 1px, transparent 1px);

background-size:80px 80px;

opacity:.05;

}

/* HOST */

.chartHost{
width:100vw;
height:100vh;
}

/* LAYOUT */

.vwrap{

height:100%;

display:grid;

grid-template-rows:
90px
2fr
160px;

gap:16px;

padding:24px;

box-sizing:border-box;

}

/* TOTAL */

.cap{

display:flex;
justify-content:center;
align-items:center;

font-size:72px;
font-weight:900;

letter-spacing:3px;

color:#14b8d4;

background:linear-gradient(180deg,#020617,#000);

border-radius:14px;

box-shadow:
0 0 25px rgba(0,255,255,.35),
inset 0 0 20px rgba(0,255,255,.15);

}

/* PLOT */

.plot{

position:relative;

border-radius:14px;

border:1px solid rgba(0,255,255,.2);

background:
linear-gradient(to bottom, rgba(0,255,255,.10) 1px, transparent 1px);

background-size:100% 20%;

box-shadow:
0 0 30px rgba(0,255,255,.12),
inset 0 0 30px rgba(0,255,255,.12);

overflow:hidden;

}

canvas{
width:100%;
height:100%;
display:block;
}

/* LABELS */

.labelsLayer{

position:relative;
height:100%;

}

.xlabel{

position:absolute;

left:0;

transform:translateX(-50%) rotate(-45deg);

font-weight:700;

white-space:nowrap;

color:#0ea5b7;

opacity:0.9;

text-shadow:0 0 6px rgba(0,255,255,.4);

}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";

const RANGE="J3:K19";

const REFRESH_MS=90000;

const chart=document.getElementById("chart");

/* CSV */

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;

}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);

}

function toNumber(v){

const s=String(v??"")
.replace(/\s/g,"")
.replace(",",".");

const n=Number(s);

return Number.isFinite(n)?n:0;

}

/* SCALE */

function niceMax(v){

if(v<=0)return 1;

const exp=Math.pow(10,Math.floor(Math.log10(v)));
const frac=v/exp;

let niceFrac;

if(frac<=1)niceFrac=1;
else if(frac<=2)niceFrac=2;
else if(frac<=5)niceFrac=5;
else niceFrac=10;

return niceFrac*exp;

}

/* BAR */

function drawBar(ctx,x,y,w,h){

const gradient=ctx.createLinearGradient(0,y,0,y+h);

gradient.addColorStop(0,"#67e8f9");
gradient.addColorStop(.5,"#06b6d4");
gradient.addColorStop(1,"#0891b2");

ctx.fillStyle=gradient;

ctx.shadowColor="#06b6d4";
ctx.shadowBlur=18;

ctx.fillRect(x,y,w,h);

ctx.shadowBlur=0;

}

/* RENDER */

function renderChart(pairs){

let items=pairs.map(r=>({name:r[0],value:toNumber(r[1])}));

items.sort((a,b)=>b.value-a.value);

const total = items.reduce((s,i)=>s+i.value,0);

const maxData=Math.max(0,...items.map(x=>x.value));
const axisMax=niceMax(maxData||1);

chart.innerHTML=`

<div class="vwrap">

<div class="cap">
TOTAL ${total.toLocaleString()}
</div>

<div class="plot">
<canvas></canvas>
</div>

<div class="labelsLayer"></div>

</div>

`;

const plot=chart.querySelector(".plot");
const canvas=chart.querySelector("canvas");
const labelsLayer=chart.querySelector(".labelsLayer");

function redraw(){

const rect=plot.getBoundingClientRect();

const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

canvas.style.width=rect.width+"px";
canvas.style.height=rect.height+"px";

labelsLayer.innerHTML="";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);

ctx.clearRect(0,0,rect.width,rect.height);

const padL=20,padR=20,padT=20,padB=30;

const W=rect.width-padL-padR;
const H=rect.height-padT-padB;

const n=items.length;
const gap=12;

const barW=Math.max(10,Math.floor((W-gap*(n-1))/n));

const totalW=n*barW+(n-1)*gap;

let startX=padL+(W-totalW)/2;

items.forEach((it,i)=>{

let pct=(it.value/axisMax)*100;

const h=(pct/100)*H;

const x=startX+i*(barW+gap);
const y=padT+(H-h);

drawBar(ctx,x,y,barW,h);

/* VALUE */

const text=it.value.toLocaleString();

ctx.font="900 54px Inter";

ctx.fillStyle="#14b8d4";

ctx.textAlign="center";

ctx.shadowColor="#06b6d4";
ctx.shadowBlur=10;

ctx.fillText(text,x+barW/2,y-8);

ctx.shadowBlur=0;

/* LABEL */

const label=document.createElement("div");

label.className="xlabel";

label.innerText=it.name;

label.style.left=(x+barW/2)+"px";
label.style.bottom="20px";

label.style.fontSize=Math.min(28,barW*0.35)+"px";

labelsLayer.appendChild(label);

});

}

redraw();

window.addEventListener("resize",redraw);

}

async function load(){

const text=await fetch(csvUrl(RANGE)).then(r=>r.text());

const data=parseCSV(text);

renderChart(data);

}

load();

setInterval(load,REFRESH_MS);

</script>

</body>
</html>
