<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bonus Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
width:100vw;
height:100vh;
overflow:hidden;
background:#020617;
font-family:'Inter',sans-serif;
color:#14b8d4;
position:relative;
}

/* фон */

body::after{
content:"";
position:fixed;
inset:0;
background-image:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2000&q=80");
background-size:cover;
background-position:center;
opacity:0.15;
filter:blur(2px) brightness(0.35);
z-index:-1;
}

/* HUD сетка */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#0ea5e9 1px, transparent 1px),
linear-gradient(90deg,#0ea5e9 1px, transparent 1px);
background-size:80px 80px;
opacity:.05;
z-index:0;
}

.chartHost{
width:100vw;
height:100vh;
}

.vwrap{
height:100%;
display:grid;
grid-template-rows:
90px
1fr
15vh;
gap:16px;
padding:24px;
box-sizing:border-box;
}

/* TOTAL */

.cap{
display:flex;
justify-content:center;
align-items:center;
font-size:72px;
font-weight:900;
letter-spacing:3px;
color:#e5e7eb;
background:linear-gradient(180deg,#020617,#000);
border-radius:14px;
box-shadow:
0 0 25px rgba(0,255,255,.35),
inset 0 0 20px rgba(0,255,255,.15);
}

/* CHART */

.plot{
position:relative;
border-radius:14px;
border:1px solid rgba(0,255,255,.2);
background:
linear-gradient(to bottom, rgba(0,255,255,.10) 1px, transparent 1px);
background-size:100% 20%;
box-shadow:
0 0 30px rgba(0,255,255,.12),
inset 0 0 30px rgba(0,255,255,.12);
overflow:hidden;
}

canvas{
width:100%;
height:100%;
display:block;
}

/* LABELS */

.labelsLayer{
position:relative;
height:100%;
}

.xlabel{
position:absolute;
left:0;
top:50%;
transform:translate(-50%,-50%) rotate(-75deg);
transform-origin:center;

font-weight:800;
white-space:nowrap;
text-align:center;
line-height:1.1;

color:#e5e7eb;

text-shadow:
0 2px 2px rgba(0,0,0,0.8),
0 0 6px rgba(34,211,238,0.5);

pointer-events:none;
}

/* SPEEDOMETER */

.speedo{
position:absolute;
right:60px;
top:40px;
width:984px;
height:984px;
border-radius:50%;
background: radial-gradient(circle,#020617 40%,#000 100%);
border:2px solid rgba(34,211,238,.4);
box-shadow:
0 0 25px rgba(34,211,238,.4),
inset 0 0 25px rgba(34,211,238,.25);
}

.speedo canvas{
width:100%;
height:100%;
}

</style>
</head>

<body>

<div id="chart" class="chartHost"></div>

<script>

const SPREADSHEET_ID="130is9FQRGEP7nf-tLVPwi1VGCtvRGW4mkpJcEo5T_fc";
const GID="41203482";
const RANGE="J3:K19";
const REFRESH_MS=90000;

const chart=document.getElementById("chart");

/* CSV */

function csvUrl(range){
return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}&range=${range}&t=${Date.now()}`;
}

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let inQuotes=false;

for(let i=0;i<text.length;i++){

const ch=text[i];
const next=text[i+1];

if(ch=='"'&&inQuotes&&next=='"'){cell+='"';i++;continue;}
if(ch=='"'){inQuotes=!inQuotes;continue;}

if(ch=="\n"&&!inQuotes){
row.push(cell);
rows.push(row);
row=[];
cell="";
continue;
}

if(ch=="\r")continue;

if(ch==","&&!inQuotes){
row.push(cell);
cell="";
continue;
}

cell+=ch;

}

row.push(cell);
rows.push(row);

return rows
.map(r=>(r||[]).map(v=>(v??"").trim()))
.filter(r=>r.length>=2);

}

function toNumber(v){
const s=String(v??"")
.replace(/\s/g,"")
.replace(",",".");
const n=Number(s);
return Number.isFinite(n)?n:0;
}

/* SPEEDOMETER */

function drawSpeedometer(value,max){

const canvas=document.getElementById("speedo");
if(!canvas) return;

const rect=canvas.parentElement.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=rect.height*dpr;

const ctx=canvas.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);

const w=rect.width;
const h=rect.height;

const cx=w/2;
const cy=h/2;

const margin=120;
const r=Math.min(w,h)/2-margin;

/* шкала */

ctx.lineWidth=40;
ctx.strokeStyle="rgba(34,211,238,.25)";
ctx.beginPath();
ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
ctx.stroke();

/* деления */

const steps=4;

ctx.fillStyle="#e5e7eb";
ctx.font="700 46px Inter";
ctx.textAlign="center";
ctx.textBaseline="middle";

for(let i=0;i<=steps;i++){

const pct=i/steps;
const angle=Math.PI*0.75+pct*Math.PI*1.5;

const x1=cx+Math.cos(angle)*(r-10);
const y1=cy+Math.sin(angle)*(r-10);

const x2=cx+Math.cos(angle)*(r+8);
const y2=cy+Math.sin(angle)*(r+8);

ctx.lineWidth=8;
ctx.strokeStyle="#22d3ee";

ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();

const labelValue=(max/steps)*i;

let text;

if(labelValue===0) text="0";
else if(labelValue>=1000000) text=(labelValue/1000000).toFixed(1)+"M";
else text=(labelValue/1000)+"k";

let lx=cx+Math.cos(angle)*(r+60);
let ly=cy+Math.sin(angle)*(r+60);

/* коррекция 400k */

if(text==="400k"){
lx-=30;
}

ctx.fillText(text,lx,ly);

}

/* прогресс */

const pct=Math.min(value/max,1);

ctx.strokeStyle="#22d3ee";
ctx.shadowColor="#22d3ee";
ctx.shadowBlur=20;
ctx.lineWidth=40;

ctx.beginPath();
ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*0.75+pct*Math.PI*1.5);
ctx.stroke();

ctx.shadowBlur=0;

/* стрелка */

const angle=Math.PI*0.75+pct*Math.PI*1.5;

const px=cx+Math.cos(angle)*(r-80);
const py=cy+Math.sin(angle)*(r-80);

ctx.lineWidth=10;
ctx.strokeStyle="#67e8f9";

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(px,py);
ctx.stroke();

/* центр */

ctx.fillStyle="#22d3ee";
ctx.beginPath();
ctx.arc(cx,cy,6,0,Math.PI*2);
ctx.fill();

/* текст */

ctx.fillStyle="#e5e7eb";
ctx.textAlign="center";

ctx.font="700 54px Inter";
ctx.fillText(value.toLocaleString(),cx,cy+60);

ctx.font="700 44px Inter";
ctx.fillText("—",cx,cy+115);

ctx.font="600 50px Inter";
ctx.fillText(max.toLocaleString(),cx,cy+170);

}

/* остальной код renderChart / load оставлен без изменений */

</script>

</body>
</html>
