<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<title>HUD Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;900&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#020617;
font-family:Inter;
color:#e5e7eb;
overflow:hidden;
}

/* layout */

.wrap{
display:grid;
grid-template-rows:80px 1fr;
height:100vh;
padding:20px;
}

.total{
text-align:center;
font-size:48px;
font-weight:900;
}

/* plot */

.plot{
position:relative;
height:100%;
}

canvas{
width:100%;
height:100%;
display:block;
}

/* speedo */

#speedo{
position:absolute;
right:40px;
top:40px;
width:400px;
height:400px;
}

</style>
</head>

<body>

<div class="wrap">
  <div id="total">TOTAL 0</div>
  <div class="plot">
    <canvas id="bars"></canvas>
    <canvas id="speedo"></canvas>
  </div>
</div>

<script>

/* CONFIG */

const REFRESH_MS = 120000;

/* STATE */

const barsCanvas = document.getElementById("bars");
const speedCanvas = document.getElementById("speedo");

let barsCtx = barsCanvas.getContext("2d");
let speedCtx = speedCanvas.getContext("2d");

/* DATA (пример) */

let demoData = [
["A",100000],
["B",90000],
["C",80000],
["D",70000],
["E",60000],
["F",50000],
["G",40000]
];

/* RESIZE */

function resize(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  return ctx;
}

/* BARS */

function drawBars(data){

  barsCtx = resize(barsCanvas);

  const W = barsCanvas.clientWidth;
  const H = barsCanvas.clientHeight;

  barsCtx.clearRect(0,0,W,H);

  const max = Math.max(...data.map(d=>d[1]));

  const barW = W/data.length * 0.6;
  const gap = W/data.length * 0.4;

  data.forEach((d,i)=>{

    const v = d[1];

    const h = (v/max)*H;
    const x = i*(barW+gap)+gap/2;
    const y = H-h;

    /* glow */

    barsCtx.shadowColor="#22d3ee";
    barsCtx.shadowBlur=20;

    /* gradient */

    const g = barsCtx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,"#67e8f9");
    g.addColorStop(1,"#0891b2");

    barsCtx.fillStyle=g;
    barsCtx.fillRect(x,y,barW,h);

    barsCtx.shadowBlur=0;

    /* value */

    barsCtx.fillStyle="#fff";
    barsCtx.font="20px Inter";
    barsCtx.textAlign="center";

    barsCtx.fillText(v.toLocaleString(),x+barW/2,y-10);

  });

}

/* SPEEDO */

function drawSpeedo(value,max){

  speedCtx = resize(speedCanvas);

  const W = speedCanvas.clientWidth;
  const H = speedCanvas.clientHeight;

  const cx=W/2;
  const cy=H/2;
  const r=Math.min(W,H)/2 - 30;

  speedCtx.clearRect(0,0,W,H);

  /* base */

  speedCtx.strokeStyle="rgba(255,255,255,.2)";
  speedCtx.lineWidth=20;

  speedCtx.beginPath();
  speedCtx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
  speedCtx.stroke();

  /* progress */

  const pct = value/max;

  speedCtx.strokeStyle="#22d3ee";
  speedCtx.shadowColor="#22d3ee";
  speedCtx.shadowBlur=20;

  speedCtx.beginPath();
  speedCtx.arc(
    cx,cy,r,
    Math.PI*0.75,
    Math.PI*0.75 + pct*Math.PI*1.5
  );
  speedCtx.stroke();

  speedCtx.shadowBlur=0;

  /* needle */

  const a = Math.PI*0.75 + pct*Math.PI*1.5;

  speedCtx.beginPath();
  speedCtx.moveTo(cx,cy);
  speedCtx.lineTo(
    cx + Math.cos(a)*(r-40),
    cy + Math.sin(a)*(r-40)
  );
  speedCtx.strokeStyle="#fff";
  speedCtx.lineWidth=3;
  speedCtx.stroke();

}

/* UPDATE */

function update(){

  const data = demoData.sort((a,b)=>b[1]-a[1]);

  const total = data.reduce((s,d)=>s+d[1],0);

  document.getElementById("total").innerText =
    "TOTAL " + total.toLocaleString();

  drawBars(data);
  drawSpeedo(total,1600000);

}

/* INIT */

window.addEventListener("resize", update);

update();
setInterval(update, REFRESH_MS);

</script>

</body>
</html>
